plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	testmod
}

configurations {
	testmodImplementation.extendsFrom implementation
}

repositories {
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.terraformersmc.com/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"custom-enchants" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"custom-enchants-testmod" {
			sourceSet sourceSets.testmod
		}
	}

	runs {
		testmodServer {
			server()
			name "Testmod Server"
			source sourceSets.testmod
			runDir "build/testmod-server"
		}
		gametest {
			inherit testmodServer
			name "Fabric GameTest"
			runDir "build/gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/reports/gametest/results.xml"
		}
		dedicatedServerSmoke {
			server()
			name "Dedicated Server Smoke"
			source sourceSets.main
			runDir "build/dedicated-server-smoke"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modClientImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.0")
	testmodImplementation sourceSets.main.output
	testmodCompileOnly files(sourceSets.main.compileClasspath)
	testmodRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	systemProperty "projectDir", project.projectDir.absolutePath
}

tasks.register("gameTest") {
	group = "verification"
	description = "Runs the Fabric GameTest server and validates its XML report."
	dependsOn "runGametest"
	doLast {
		def report = file("${project.buildDir}/reports/gametest/results.xml")
		if (!report.isFile()) {
			throw new GradleException("GameTest did not produce ${report}")
		}
		def text = report.getText("UTF-8")
		if (!text.contains("<failure") && !text.contains("<error") && text.contains("<testcase")) {
			logger.lifecycle("GameTest XML report: all tests passed")
		} else {
			throw new GradleException("GameTest report contains failures: ${report}")
		}
	}
}

tasks.register("verifyReleaseJar") {
	group = "verification"
	description = "Verifies the remapped release JAR packaging contract."
	dependsOn remapJar
	doLast {
		def release = tasks.named("remapJar").get().archiveFile.get().asFile
		def archive = new java.util.zip.ZipFile(release)
		def entries = archive.entries().findAll { !it.isDirectory() }.collect { it.name } as Set
		archive.close()
		def required = [
			"fabric.mod.json",
			"LICENSE_custom-enchants",
			"assets/custom-enchants/icon.png",
			"assets/custom-enchants/lang/en_us.json",
			"assets/custom-enchants/lang/ru_ru.json",
			"custom-enchants.mixins.json",
			"custom-enchants.client.mixins.json"
		]
		def missing = required.findAll { !entries.contains(it) }
		if (!missing.isEmpty()) throw new GradleException("Release JAR missing: ${missing}")
		def forbidden = entries.findAll { it.endsWith(".java") || it.startsWith("docs/") || it.startsWith(".git/") || it.startsWith("build/") || it.startsWith("run/") || it.startsWith("logs/") || it.startsWith("test/") || it.contains("/test/") }
		if (!forbidden.isEmpty()) throw new GradleException("Release JAR contains forbidden entries: ${forbidden}")
		def absolute = entries.findAll { it.startsWith("/") || it.contains(":\\") || it.contains("/home/") }
		if (!absolute.isEmpty()) throw new GradleException("Release JAR contains absolute paths: ${absolute}")
		if (entries.count { it.endsWith(".class") } == 0) throw new GradleException("Release JAR contains no production classes")
		logger.lifecycle("Release JAR contract passed: ${release.name}")
	}
}

tasks.register("dedicatedServerSmoke") {
	group = "verification"
	description = "Runs an isolated dedicated server smoke and validates the EULA gate marker."
	dependsOn "runDedicatedServerSmoke"
	doLast {
		def log = file("${project.buildDir}/dedicated-server-smoke/logs/latest.log")
		if (!log.isFile()) throw new GradleException("Dedicated smoke log missing: ${log}")
		def text = log.getText("UTF-8")
		if (!text.contains("Mentalitys | Custom Enchantments initialized!")) throw new GradleException("Dedicated smoke did not initialize the mod")
		if (!text.contains("You need to agree to the EULA")) throw new GradleException("Dedicated smoke did not reach the expected EULA gate")
		if (text.contains("client.mixins.json") && text.contains("Env=SERVER")) throw new GradleException("Dedicated smoke attempted to load client mixins")
		logger.lifecycle("Dedicated server smoke passed: initialization and EULA gate")
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

// Branch-local archive naming: the 1.21.1 build must not collide with the published
// 1.20.1 asset. The mod version stays 3.1.0 (fabric.mod.json); only the file name carries
// the Minecraft suffix, e.g. custom-enchants-3.1.0-mc1.21.1.jar.
def mcArchiveVersion = "${project.mod_version}-${project.archive_minecraft_suffix}"
tasks.matching { it.name in ["jar", "sourcesJar", "remapJar", "remapSourcesJar"] }.configureEach {
	archiveVersion = mcArchiveVersion
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
