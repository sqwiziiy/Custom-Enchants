            - generic [ref=f2e692]:
              - paragraph [ref=f2e693]:
                - generic [ref=f2e694]:
                  - strong [ref=f2e695]: "Compatibility:"
                  - text: released for Minecraft 1.21.1 and 1.21.11 (Java 21). Minecraft 1.20.1 remains on 3.2.4 because its Double Jump behavior was already correct.
              - paragraph [ref=f2e696]:
                - generic [ref=f2e697]:
                  - strong [ref=f2e698]: "Root cause:"
                  - text: the 1.21.x owner client waited for the complete server approval round trip before receiving the Double Jump impulse, creating a late horizontal/vertical kick and allowing direction to drift if yaw changed while the request was in flight.
              - paragraph [ref=f2e699]:
                - generic [ref=f2e700]:
                  - strong [ref=f2e701]: "Fixed:"
                  - text: movement is predicted immediately on the input tick; C2S carries sprint + activation-yaw snapshots; the server remains authoritative and applies the equivalent snapshot-based impulse; S2C approval is acknowledgement-only and cannot add a second delayed impulse. Minecraft 1.21.11 uses its valid
                  - code [ref=f2e702]: hurtMarked
                  - text: synchronization path.
              - paragraph [ref=f2e703]:
                - generic [ref=f2e704]:
                  - strong [ref=f2e705]: "Validation:"
                  - text: both 1.21.1 and 1.21.11 builds passed automated validation and were manually accepted in-game.
