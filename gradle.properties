# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.8.11

# Mod Properties
mod_version=3.2.3
# Branch-local archive suffix so the 1.21.1 asset never collides with the 1.20.1 release.
archive_minecraft_suffix=mc1.21.1
maven_group=com.mentality.customenchants
archives_base_name=custom-enchants

# Dependencies
fabric_api_version=0.116.15+1.21.1
cloth_config_version=15.0.140
modmenu_version=11.0.4
