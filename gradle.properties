# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=3.1.1
# Branch-local archive suffix so the 1.21.11 asset never collides with the 1.20.1/1.21.1 releases.
archive_minecraft_suffix=mc1.21.11
maven_group=com.mentality.customenchants
archives_base_name=custom-enchants

# Dependencies
fabric_api_version=0.141.6+1.21.11
cloth_config_version=21.11.153
modmenu_version=17.0.0
