name: CI

on:
  push:
    branches:
      - "3.2/1.20.1"
  pull_request:
    branches:
      - "3.2/1.20.1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.http.connectionTimeout=60000
        -Dorg.gradle.internal.http.socketTimeout=180000
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve dependencies
        shell: bash
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Dependency resolution attempt ${attempt}/${attempts}"

            if ./gradlew \
              --no-daemon \
              --console=plain \
              dependencies \
              --configuration modImplementation \
              --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Dependency resolution failed after ${attempts} attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Retrying in ${sleep_seconds} seconds..."
            sleep "$sleep_seconds"
          done

      - name: Print tool versions
        run: |
          java -version
          javac -version
          ./gradlew --version

      - name: Unit and contract tests
        run: ./gradlew --no-daemon --console=plain clean test --stacktrace

      - name: Gradle check
        run: ./gradlew --no-daemon --console=plain check --stacktrace --warning-mode all

      - name: Gradle build
        run: ./gradlew --no-daemon --console=plain build --stacktrace --warning-mode all

      - name: Verify release JAR
        run: ./gradlew --no-daemon --console=plain verifyReleaseJar --stacktrace

      - name: Run official Fabric GameTest
        run: ./gradlew --no-daemon --console=plain gameTest --stacktrace

      - name: Run isolated dedicated server smoke
        run: ./gradlew --no-daemon --console=plain dedicatedServerSmoke --stacktrace

      - name: List release artifacts and hashes
        run: |
          find build/libs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum build/libs/*.jar

      - name: Resolve release artifact metadata
        id: release_meta
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          release_jar="build/libs/custom-enchants-${mod_version}.jar"
          artifact_name="custom-enchants-${mod_version}-mc1.20.1-java17"

          test -n "$mod_version"
          test -f "$release_jar"

          echo "jar=$release_jar" >> "$GITHUB_OUTPUT"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload release JAR artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release_meta.outputs.name }}
          path: ${{ steps.release_meta.outputs.jar }}
          if-no-files-found: error

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/gametest/**
            build/gametest/**
            build/dedicated-server-smoke/**
            build/logs/**
          if-no-files-found: ignore
