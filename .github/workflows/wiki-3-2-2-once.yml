name: Wiki 3.2.2 update

on:
  push:
    branches: [wiki]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiki
          fetch-depth: 0

      - name: Apply wiki patch
        run: python .github/wiki_patch.py

      - name: Commit updated wiki
        run: |
          git config user.name "Mentality"
          git config user.email "186711264+sqwiziiy@users.noreply.github.com"
          git add index.html
          git rm .github/wiki_patch.py .github/workflows/wiki-3-2-2-once.yml
          git diff --cached --check
          git commit -m "Update wiki for 3.2.2 release"
          git push origin HEAD:wiki
